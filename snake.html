<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; background:#111; color:#eee; font-family:sans-serif; }
  canvas { background:#1b1b1b; border:2px solid #444; max-width:95vw; touch-action:none; }
  #score { margin:10px; font-size:20px; }
  small { color:#888; margin-top:8px; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="c" width="400" height="400"></canvas>
<small>Arrow keys / WASD / swipe to move. Space or tap to restart.</small>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, S = cv.width / N;
let snake, dir, nextDir, food, score, over, timer;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0};
  score = 0; over = false;
  placeFood(); update();
  clearInterval(timer); timer = setInterval(tick, 110);
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function tick() {
  dir = nextDir;
  const h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (h.x<0||h.y<0||h.x>=N||h.y>=N || snake.some(s=>s.x===h.x&&s.y===h.y)) {
    over = true; clearInterval(timer); draw(); return;
  }
  snake.unshift(h);
  if (h.x===food.x && h.y===food.y) { score++; placeFood(); } else snake.pop();
  update();
}
function update() { document.getElementById('score').textContent = 'Score: ' + score; draw(); }
function draw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x*S+2, food.y*S+2, S-4, S-4);
  snake.forEach((s,i) => { ctx.fillStyle = i ? '#2ecc71' : '#27ae60'; ctx.fillRect(s.x*S+1, s.y*S+1, S-2, S-2); });
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '32px sans-serif'; ctx.fillText('Game Over', 200, 190);
    ctx.font = '18px sans-serif'; ctx.fillText('Score ' + score + ' - press Space or tap', 200, 225);
  }
}
function turn(x, y) { if (x !== -dir.x || y !== -dir.y) nextDir = {x, y}; }
const keys = {ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); if (over) reset(); return; }
  const k = keys[e.key]; if (k) { e.preventDefault(); turn(...k); }
});
let t0;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; if (over) reset(); });
cv.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX-t0.clientX, dy = t.clientY-t0.clientY;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx),0) : turn(0,Math.sign(dy));
});
reset();
</script>
</body>
</html>
